<!doctype html>
<html lang="%paraglide.locale%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			/* The Three-State Lamp pre-paint (ADR-0023 D3, 2026-10-11): resolve
			 * the choice and set html[data-theme] BEFORE the bundle paints —
			 * no flash of light on a dark reload. The key 'dsi-theme' is
			 * pinned identical to src/lib/utils/theme-prefs.svelte.ts by
			 * tests/unit/theme-prefs.test.ts; change both together. */
			try {
				var m = location.search.match(/[?&]profile=([^&]*)/);
				var prof = m ? m[1].replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) : '';
				var k = 'dsi-theme' + (prof ? '_' + prof : '');
				var t = localStorage.getItem(k);
				if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
				document.documentElement.dataset.theme =
					t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
						? 'dark'
						: 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
